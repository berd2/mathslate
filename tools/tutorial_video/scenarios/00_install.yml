title: 설치와 첫 실행
subtitle: pip install 한 줄과 Jupyter Lab
output: 00_install.mp4
env: terminal
scenes:
  - caption: 터미널에서 한 줄로 설치합니다 (실제 설치를 빨리 감아 보여 줍니다)
    steps:
      - terminal: {type: 'pip install "mathslate[starter]"', capture: pip_install, target_seconds: 14, hold: 3}
  - caption: Jupyter Lab과 대화형 컨트롤, 도우미, 키 저장까지 함께 설치됩니다
    steps:
      - wait: 3
  - caption: jupyter lab으로 엽니다
    steps:
      - terminal: {type: "jupyter lab", capture: jupyter_lab, keep: ["Or copy and paste", "http://localhost"], prompt: false, hold: 2.5}
  - caption: 브라우저에 Jupyter Lab이 열립니다
    steps:
      - browser: {}
      - wait: 1.5
  - caption: 새 노트북의 첫 셀, 이 한 줄이 설정의 전부입니다
    steps:
      - cell: {index: 0, code_from: "tutorial_ko.md#video:first-plot", part: 0}
      - run: {wait_output: any, timeout: 90}
