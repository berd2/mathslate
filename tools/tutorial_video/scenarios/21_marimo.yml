title: marimo에서 쓰기
subtitle: import * 대신 이름을 명시한다
output: 21_marimo.mp4
env: marimo
scenes:
  - caption: marimo에서도 씁니다. 먼저 다른 곳처럼 import *를 써 봅니다
    steps:
      - cell: {index: 0, code: "from mathslate import *"}
      - run: {expect_text: "is not allowed in marimo", timeout: 60}
  - caption: marimo는 import *를 허용하지 않습니다 — 셀이 정의하는 이름을 미리 알아야 하기 때문입니다
    steps:
      - highlight: {text: "is not allowed in marimo", seconds: 4}
  - caption: 필요한 이름을 직접 가져옵니다
    steps:
      - cell: {index: 0, code: "from mathslate import plot, sin, x", replace: true}
      - run: {settle_ms: 1500}
  - caption: 나머지는 똑같습니다
    steps:
      - cell: {index: 1, code: "plot(sin(x))"}
      - run: {wait_output: figure, timeout: 90}
