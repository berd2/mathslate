title: 다른 사람에게 전달
subtitle: worksheet와 HTML 한 파일
output: 10_worksheet.mp4
setup:
  notebook: blank
scenes:
  - caption: 먼저 한 줄로 가져옵니다
    steps:
      - cell: {index: 0, code_from: "tutorial_ko.md#video:first-plot", part: 0}
      - run: {wait_output: any, timeout: 90}
  - caption: 문제와 그래프와 숫자 표를 한 장으로 묶습니다
    steps:
      - cell: {index: 1, code_from: "tutorial_ko.md#video:worksheet"}
      - run: {wait_output: any, expect_text: "sections", timeout: 90}
  - caption: save()로 HTML 한 파일이 만들어집니다
    steps:
      - cell: {index: 2, code: 'page.save("handout.html")'}
      - run: {wait_output: any, timeout: 60}
  - caption: 받는 사람은 브라우저로 엽니다. 그래프는 그대로 마우스로 다룰 수 있습니다
    steps:
      - new_tab: {file: handout.html, seconds: 3}
