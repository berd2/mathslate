[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mathslate"
version = "0.1.5"
description = "A mathematical workspace that grows with you."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MathSlate contributors" }]
keywords = ["mathematics", "sympy", "plotly", "education", "plotting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

# PRD 6.2 / acceptance criterion 6: no frontend dependency is pulled in.
dependencies = ["sympy>=1.12", "numpy>=1.24", "plotly>=5.18"]

[project.urls]
Homepage = "https://github.com/berd2/mathslate"
Documentation = "https://github.com/berd2/mathslate/blob/master/docs/manual.md"
Repository = "https://github.com/berd2/mathslate"
Issues = "https://github.com/berd2/mathslate/issues"

[project.optional-dependencies]
# anywidget: Plotly >= 6 rebuilt FigureWidget on it, which range_controls()
# (PRD §19) needs for live resampling — a second package ipywidgets does not
# pull in on its own. Bundled here so one extra is actually enough.
jupyter = ["ipywidgets>=8.0", "anywidget>=0.9"]
marimo = ["marimo>=0.9"]
# PRD 8: the AI assistant is an extra so the core stays usable on a school or
# corporate network that blocks it. Pick one; none of them is required.
ai = ["anthropic>=0.40", "keyring>=24.0"]
ai-openai = ["openai>=1.50", "keyring>=24.0"]
ai-gemini = ["google-genai>=2.0", "keyring>=24.0"]
# The one-command path for a learner's local notebook: Jupyter Lab itself,
# every widget MathSlate uses, the approachable Gemini provider, and the OS
# credential integration for its Remember checkbox. Keeping this here (rather
# than as a hand-maintained script list) makes the quickstart and `pip install`
# path install the same complete environment.
starter = [
    "ipywidgets>=8.0",
    "anywidget>=0.9",
    "google-genai>=2.0",
    "keyring>=24.0",
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
]
# `tomli` backports the standard-library `tomllib` (added in 3.11) so the test
# suite reads pyproject.toml on the 3.10 floor named in `requires-python`.
dev = ["pytest>=8.0", "tomli>=2.0; python_version < '3.11'"]

[tool.hatch.build.targets.wheel]
packages = ["mathslate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
