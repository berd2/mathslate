name: CI

# Every code change runs lint and the full suite on one representative
# Linux/Python pair, plus the clean-install acceptance check. The four-platform
# matrix remains available from Actions with the `full_matrix` switch.
on:
  push:
    branches: [master]
    paths:
      - "mathslate/**"
      - "tests/**"
      - "scripts/**"
      - "examples/**"
      - "docs/**"
      - "lite/**"
      - "README.md"
      - "README_ko.md"
      - "pyproject.toml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "mathslate/**"
      - "tests/**"
      - "scripts/**"
      - "examples/**"
      - "docs/**"
      - "lite/**"
      - "README.md"
      - "README_ko.md"
      - "pyproject.toml"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      full_matrix:
        description: "Also run the full Windows/Linux and Python 3.10/3.12 matrix"
        required: false
        default: false
        type: boolean
  schedule:
    # Monday 03:17 Asia/Seoul: a full, fresh-dependency check without slowing
    # ordinary pull-request feedback.
    - cron: "17 18 * * 0"

concurrency:
  # The event is part of the group, and the weekly run is never cancelled. A
  # schedule runs on refs/heads/master, so with a shared group and
  # cancel-in-progress a push landing on Monday morning cancelled the only full
  # regression run outside a release.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  lint:
    name: lint (ruff)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: tests (Python 3.12, Ubuntu)
    # `weekly_regression` runs the whole suite on a schedule; repeating it
    # beside that run would only spend runner time on the same checks.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # All three notebook hosts, so acceptance criterion 5 really runs.
      - run: pip install -e ".[dev,jupyter,marimo]" nbclient nbformat ipykernel
      # The whole suite on every change, in parallel: the restricted-execution
      # safety tests and the core sampling/dispatch/codegen tests used to run
      # only weekly, so a regression there could merge unseen. The
      # four-platform matrix remains available through `full_matrix`.
      - run: python -m pytest -q -n auto

  weekly_regression:
    name: weekly full regression (Python 3.12, Ubuntu)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,jupyter,marimo]" nbclient nbformat ipykernel
      - run: python -m pytest -q

  full_matrix:
    name: full tests (py${{ matrix.python }}, ${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.full_matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,jupyter,marimo]" nbclient nbformat ipykernel
      - run: >-
          python -m pytest -q
          --deselect tests/test_tour_notebooks.py::TestTheyAreGeneratedAndCurrent
          --deselect tests/test_tour_notebooks.py::TestTheMarimoGraphIsSound
          --deselect tests/test_tour_notebooks.py::TestItRunsInMarimoToo

  core_install:
    name: core install has no optional dependencies
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install the package exactly as a user would
        run: pip install .
      - name: assert no optional package came with it
        run: |
          python - <<'PY'
          import sys
          from importlib.metadata import PackageNotFoundError, version

          optional = (
              "marimo", "ipywidgets", "notebook", "jupyter-core",
              "anthropic", "openai", "google-genai", "keyring",
          )
          for package in optional:
              try:
                  installed = version(package)
              except PackageNotFoundError:
                  continue
              sys.exit(
                  f"{package} {installed} was installed by `pip install mathslate`"
              )
          import mathslate
          mathslate.plot(mathslate.sin(mathslate.x), verbose=False)
          print("clean core install, plot works:", mathslate.frontend_report())
          PY
