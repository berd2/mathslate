name: CI

# Manual-only: CI runs when you ask for it from the Actions tab, not on every
# push or pull request. Use the "Run workflow" button (GitHub → Actions → CI →
# Run workflow, choosing the branch), or `gh workflow run CI --ref <branch>`.
# The button only appears once this file is on the default branch.
#
# To restore automatic runs, add back:
#   push:
#   pull_request:
on:
  workflow_dispatch:

jobs:
  test:
    name: tests (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # All three notebook hosts, so acceptance criterion 5 really runs.
      - run: pip install -e ".[dev,jupyter,marimo]" nbclient nbformat ipykernel
      # The marimo tour is maintained separately by its author.  Its expensive
      # rendering and generator-synchronisation checks remain available for
      # manual verification, but must not make the library CI fail.
      #
      # Only those three classes, not the whole file: ignoring all of it also
      # dropped `TestItActuallyRuns`, the one check that executes the Jupyter
      # tour in a real kernel — and so the one that would have caught
      # `plot(a*sin(x))` raising on display in every notebook (a figure with
      # frames cannot become a `FigureWidget`). Nothing else in the suite
      # exercises that path end to end.
      - run: >-
          python -m pytest -q
          --deselect tests/test_tour_notebooks.py::TestTheyAreGeneratedAndCurrent
          --deselect tests/test_tour_notebooks.py::TestTheMarimoGraphIsSound
          --deselect tests/test_tour_notebooks.py::TestItRunsInMarimoToo

  no_frontend_dependency:
    name: acceptance criterion 6 - no frontend dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install the package exactly as a user would
        run: pip install .
      - name: assert no frontend package came with it
        run: |
          python - <<'PY'
          import importlib.util, sys
          for frontend in ("marimo", "ipywidgets", "notebook", "jupyter_core"):
              if importlib.util.find_spec(frontend) is not None:
                  sys.exit(f"{frontend} was installed by `pip install mathslate`")
          import mathslate
          mathslate.plot(mathslate.sin(mathslate.x), verbose=False)
          print("clean install, plot works:", mathslate.frontend_report())
          PY
