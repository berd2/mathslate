name: CI

# Fast feedback runs on code changes: one representative Linux/Python pair
# plus the clean-install acceptance check. The previous four-platform matrix
# remains available from Actions with the `full_matrix` switch when needed.
on:
  push:
    branches: [master]
    paths:
      - "mathslate/**"
      - "tests/**"
      - "scripts/**"
      - "examples/**"
      - "docs/**"
      - "lite/**"
      - "README.md"
      - "README_ko.md"
      - "pyproject.toml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "mathslate/**"
      - "tests/**"
      - "scripts/**"
      - "examples/**"
      - "docs/**"
      - "lite/**"
      - "README.md"
      - "README_ko.md"
      - "pyproject.toml"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      full_matrix:
        description: "Also run the full Windows/Linux and Python 3.10/3.12 matrix"
        required: false
        default: false
        type: boolean
  schedule:
    # Monday 03:17 Asia/Seoul: a full, fresh-dependency check without slowing
    # ordinary pull-request feedback.
    - cron: "17 18 * * 0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python 3.12, Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # All three notebook hosts, so acceptance criterion 5 really runs.
      - run: pip install -e ".[dev,jupyter,marimo]" nbclient nbformat ipykernel
      # Fast, deterministic checks for every source change.  Full notebook,
      # widget, and multi-platform coverage remains in the manual matrix.
      - run: >-
          python -m pytest -q
          tests/test_acceptance.py
          tests/test_ai_assistant.py
          tests/test_ai_credentials.py
          tests/test_ai_explain.py
          tests/test_ai_followup.py
          tests/test_ai_repair_and_fitting.py
          tests/test_v1_data_and_ai.py
          tests/test_figure_size.py
          tests/test_view_and_mesh.py::TestSegmentControlsStayOnOneRow

  documentation:
    name: docs and tour structure (Python 3.12, Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,jupyter,marimo]" nbclient nbformat ipykernel
      # Execute manuals and validate generated-tour structure on every source
      # or documentation change. Full notebook execution is part of release
      # and weekly regression instead, keeping PR feedback prompt.
      - run: >-
          python -m pytest -q
          tests/test_docs.py
          tests/test_example_notebook.py
          tests/test_tour_notebooks.py::TestTheyAreGeneratedAndCurrent
          tests/test_tour_notebooks.py::TestTheMarimoGraphIsSound
          tests/test_tour_notebooks.py::TestTheJupyterTwinOpensCleanly

  weekly_regression:
    name: weekly full regression (Python 3.12, Ubuntu)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,jupyter,marimo]" nbclient nbformat ipykernel
      - run: python -m pytest -q

  full_matrix:
    name: full tests (py${{ matrix.python }}, ${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.full_matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,jupyter,marimo]" nbclient nbformat ipykernel
      - run: >-
          python -m pytest -q
          --deselect tests/test_tour_notebooks.py::TestTheyAreGeneratedAndCurrent
          --deselect tests/test_tour_notebooks.py::TestTheMarimoGraphIsSound
          --deselect tests/test_tour_notebooks.py::TestItRunsInMarimoToo

  core_install:
    name: core install has no optional dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install the package exactly as a user would
        run: pip install .
      - name: assert no frontend package came with it
        run: |
          python - <<'PY'
          import importlib.util, sys
          optional = (
              "marimo", "ipywidgets", "notebook", "jupyter_core",
              "anthropic", "openai", "google.genai", "keyring",
          )
          for package in optional:
              if importlib.util.find_spec(package) is not None:
                  sys.exit(f"{package} was installed by `pip install mathslate`")
          import mathslate
          mathslate.plot(mathslate.sin(mathslate.x), verbose=False)
          print("clean core install, plot works:", mathslate.frontend_report())
          PY
