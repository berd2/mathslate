name: Deploy JupyterLite to GitHub Pages

on:
  push:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # pyodide-lock, used to preload JupyterLite widget packages, requires
          # Python 3.12+. Keep the deployment builder on that supported floor.
          python-version: '3.12'

      - name: Install JupyterLite Build Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r lite/requirements.txt

      - name: Prepare JupyterLite content and MathSlate wheel
        run: |
          mkdir -p lite/files lite/wheels
          python -m build --wheel --outdir lite/wheels
          cp examples/mathslate_tour.ipynb lite/files/
          cp lite/mathslate_playground.ipynb lite/files/

      - name: Build JupyterLite Site
        run: |
          cd lite
          wheel="$(find wheels -maxdepth 1 -name 'mathslate-*.whl' -print -quit)"
          test -n "$wheel"
          jupyter lite build --contents files --output-dir ../_site --piplite-wheels "$wheel"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
