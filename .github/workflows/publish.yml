name: Publish distribution to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Release verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,jupyter,marimo]" nbclient nbformat ipykernel
      # A release is rare enough to test the complete package, including
      # notebook execution and documentation examples omitted from fast CI.
      # The marimo HTML export of the tour is the one exception, as in the
      # manual full matrix: that tour is maintained on its own, so a
      # marimo-side change must not be able to block a library release. The
      # weekly regression in ci.yml still runs it.
      - run: >-
          python -m pytest -q
          --deselect tests/test_tour_notebooks.py::TestItRunsInMarimoToo

  core_install:
    name: Core install has no optional dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the package exactly as a core user would
        run: pip install .
      - name: Confirm no AI or notebook extra was installed
        run: |
          python - <<'PY'
          import sys
          from importlib.metadata import PackageNotFoundError, version

          optional = (
              "marimo", "ipywidgets", "notebook", "jupyter-core",
              "anthropic", "openai", "google-genai", "keyring",
          )
          for package in optional:
              try:
                  installed = version(package)
              except PackageNotFoundError:
                  continue
              sys.exit(
                  f"{package} {installed} was installed by `pip install mathslate`"
              )
          import mathslate
          mathslate.plot(mathslate.sin(mathslate.x), verbose=False)
          print("clean core install, plot works:", mathslate.frontend_report())
          PY

  build:
    name: Build distribution
    needs: [verify, core_install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel and source distribution
        run: python -m pip install --upgrade build twine && python -m build && python -m twine check dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mathslate
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
