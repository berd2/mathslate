name: Publish distribution to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Release verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,jupyter,marimo]" nbclient nbformat ipykernel
      - run: >-
          python -m pytest -q
          tests/test_acceptance.py
          tests/test_ai_assistant.py
          tests/test_ai_credentials.py
          tests/test_ai_explain.py
          tests/test_ai_followup.py
          tests/test_ai_repair_and_fitting.py
          tests/test_v1_data_and_ai.py
          tests/test_figure_size.py
          tests/test_view_and_mesh.py::TestSegmentControlsStayOnOneRow

  build:
    name: Build distribution
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel and source distribution
        run: python -m pip install --upgrade build twine && python -m build && python -m twine check dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mathslate
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
